<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 – Seite nicht gefunden</title>

    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111827;
        }

        .wrapper {
            text-align: center;
            padding: 32px;
            max-width: 520px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h3 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #4b5563;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #f97316;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        a:hover {
            background-color: #70350a;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <h1>404</h1>
        <h3>Seite nicht gefunden</h3>
        <p>Die angeforderte URL wurde nicht gefunden.</p>
        <a href="/">Zur Startseite</a>
    </div>
</body>

</html>
